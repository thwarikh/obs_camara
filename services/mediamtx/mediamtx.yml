# OBS Camera Pro MediaMTX Configuration
# Optimized for ultra-low latency WebRTC (WHIP / WHEP) and RTSP streaming

logLevel: info
logDestinations: [stdout]

# API server for backend monitoring
api: yes
apiAddress: :9997

# Metrics for Prometheus / Desktop dashboard
metrics: yes
metricsAddress: :9998

# RTSP Configuration (OBS Media Source fallback)
rtsp: yes
rtspTransports: [tcp, udp]
rtspAddress: :8554
rtspsAddress: :8322
rtpAddress: :8000
rtcpAddress: :8001

# RTMP Configuration
rtmp: yes
rtmpAddress: :1935

# WebRTC Configuration (Primary low-latency protocol)
webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: yes
webrtcAdditionalHosts: []
webrtcHandshakeTimeout: 10s
webrtcTrackGatherTimeout: 2s

# HLS Configuration
hls: no

# Path definitions
paths:
  all_others:
    # Allow dynamic paths created by mobile camera apps (e.g. /camera-01, /camera-02)
    source: publisher
    sourceOnDemand: no
    overridePublisher: yes
