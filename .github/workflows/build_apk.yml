name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

    - name: Make Gradle Wrapper Executable
      run: chmod +x apps/android/gradlew

    - name: Build Debug APK
      shell: bash
      run: |
        cd apps/android
        ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../../gradle_build.log
        status=${PIPESTATUS[0]}
        echo "GRADLE_EXIT_CODE=$status" >> $GITHUB_ENV
        if [ $status -ne 0 ]; then
          echo "### Gradle Build Failed" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 120 ../../gradle_build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $status
        fi

    - name: Locate Built APK
      shell: bash
      run: |
        find apps/android -name "*.apk"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OBS-Camera-Pro-Debug-APK
        path: apps/android/app/build/outputs/apk/**/*.apk
        if-no-files-found: error
        retention-days: 14
